<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>銓Dubu嘟布韓式豆腐煲｜行銷活動</title>
<meta name="description" content="銓Dubu嘟布韓式豆腐煲 義華店的行銷活動與小遊戲。">
<link rel="icon" href="assets/brand/chuan-dubu-logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{--navy-900:#0f274d;--navy-700:#183b72;--gold-400:#fecc6b;--gold-100:#fff3d1;--ink:#1a1a1a;--paper:#fff8ec;--chili:#e63b2e}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:radial-gradient(rgba(24,59,114,.08) 1.4px,transparent 1.6px) 0 0/18px 18px,var(--paper)}
  header{background:linear-gradient(145deg,var(--navy-900),var(--navy-700));border-bottom:4px solid var(--gold-400);padding:36px 20px;text-align:center;color:#fff}
  header img{width:120px;height:120px;border-radius:50%;box-shadow:0 0 0 4px rgba(254,204,107,.35)}
  header h1{margin:14px 0 4px;color:var(--gold-400);font-size:28px;font-weight:900}
  header p{margin:0;color:var(--gold-100);font-weight:700}
  main{max-width:720px;margin:28px auto;padding:0 16px;display:flex;flex-direction:column;gap:18px}
  h2{font-size:20px;margin:6px 0 0;color:var(--navy-700)}
  .card{display:flex;gap:16px;align-items:center;background:#fff;border:4px solid var(--ink);border-radius:20px;box-shadow:4px 4px 0 var(--ink);padding:16px;text-decoration:none;color:inherit;transition:transform .12s,box-shadow .12s}
  .card:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
  .card:active{transform:translate(4px,4px);box-shadow:none}
  .card img{width:96px;flex:none}
  .card b{display:block;font-size:20px;font-weight:900}
  .card span{display:block;color:#5a6578;font-weight:500;font-size:15px;margin-top:2px}
  .tag{display:inline-block;margin-top:8px;font-size:12px;font-weight:900;padding:2px 10px;border-radius:999px;border:2px solid var(--ink);background:var(--gold-400)}
  .tag.test{background:var(--chili);color:#fff}
  footer{text-align:center;color:#5a6578;font-size:13px;padding:24px 16px 40px;line-height:1.7}
</style>
</head>
<body>
<header>
  <img src="assets/brand/chuan-dubu-logo.svg" alt="銓Dubu嘟布 logo">
  <h1>銓Dubu嘟布韓式豆腐煲</h1>
  <p>義華店｜行銷活動</p>
</header>
<main>
  <h2>進行中的活動</h2>
  <a class="card" href="tofu-catch/">
    <img src="assets/brand/tofu-idle.svg" alt="">
    <div><b>嫩豆腐接接樂</b><span>60 秒接豆腐小遊戲，玩完就能到店兌換小菜或折扣。</span><em class="tag test">測試版</em></div>
  </a>
  <h2>門市資訊</h2>
  <a class="card" href="menu/">
    <img src="assets/brand/chuan-dubu-logo.svg" alt="" style="border-radius:50%">
    <div><b>門市資訊與完整菜單</b><span>營業時間、訂位電話與菜單價格。</span></div>
  </a>
</main>
<footer>高雄市三民區義華路 468 號｜11:00–13:30、17:00–21:30｜訂位 0902-268-213</footer>
</body>
</html>
